[project]
name = "rag-mini-hk"
version = "0.1.0"
description = "A small, reproducible RAG demo: Markdown sections, BGE embeddings, Chroma retrieval, cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "chromadb>=1.0",
  "sentence-transformers>=3.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
